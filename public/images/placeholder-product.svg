<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f3f4f6"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e7eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d1d5db;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#grad1)"/>
  
  <!-- Package icon -->
  <g transform="translate(160, 140)">
    <rect x="0" y="40" width="80" height="60" rx="4" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
    <rect x="10" y="30" width="60" height="40" rx="2" fill="#d1d5db"/>
    <line x1="20" y1="50" x2="60" y2="50" stroke="#9ca3af" stroke-width="2"/>
    <line x1="40" y1="35" x2="40" y2="65" stroke="#9ca3af" stroke-width="2"/>
  </g>
  
  <!-- GSI Orders text -->
  <text x="200" y="260" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="16" font-weight="500">GSI Orders</text>
  <text x="200" y="280" text-anchor="middle" fill="#9ca3af" font-family="Arial, sans-serif" font-size="12">Product Image</text>
</svg> 